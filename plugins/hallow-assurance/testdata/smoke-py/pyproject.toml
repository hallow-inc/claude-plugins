[project]
name = "smoke"
version = "0.0.0"
requires-python = ">=3.14"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "cosmic-ray>=8.7.0",
    "hypothesis>=6.170.9",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.0.0",
]
