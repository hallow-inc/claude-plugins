name: hallow-assurance

on:
  pull_request:
  push:
    branches: [master]
    tags: ['plugins/hallow-assurance/v*']
    paths:
      - 'plugins/hallow-assurance/**'
      - '.github/workflows/hallow-assurance.yml'
      - '.github/workflows/assure-evaluate.yml'
      - '.github/workflows/assure-audit.yml'

permissions:
  contents: read

concurrency:
  group: hallow-assurance-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: plugins/hallow-assurance

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    outputs:
      run: ${{ steps.diff.outputs.run }}
      qualify: ${{ steps.diff.outputs.qualify }}
      lean: ${{ steps.diff.outputs.lean }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changes
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            case "$REF" in refs/tags/*) qualify=true ;; *) qualify=false ;; esac
            echo "qualify=$qualify" >> "$GITHUB_OUTPUT"
            echo "lean=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git merge-base HEAD "origin/$BASE_REF")
          changed=$(git diff --name-only "$base" HEAD -- plugins/hallow-assurance .github/workflows/hallow-assurance.yml .github/workflows/assure-evaluate.yml .github/workflows/assure-audit.yml)
          if [ -n "$changed" ]; then run=true; else run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          qualifying=$(git diff --name-only "$base" HEAD -- plugins/hallow-assurance .github/workflows/hallow-assurance.yml .github/workflows/assure-evaluate.yml .github/workflows/assure-audit.yml \
            ':(exclude)plugins/hallow-assurance/plugin/**' ':(exclude,glob)**/*.md')
          if [ -n "$qualifying" ]; then qualify=true; else qualify=false; fi
          echo "qualify=$qualify" >> "$GITHUB_OUTPUT"
          lean_paths=$(git diff --name-only "$base" HEAD -- plugins/hallow-assurance/formal plugins/hallow-assurance/internal/core)
          if [ -n "$lean_paths" ]; then lean=true; else lean=false; fi
          echo "lean=$lean" >> "$GITHUB_OUTPUT"

  go:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: plugins/hallow-assurance/go.mod
          cache-dependency-path: plugins/hallow-assurance/go.sum

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca  # v5.1.1
        with:
          version: 2026.8.14
          install: false
          cache: false

      - name: Verify modules
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.15.0
          working-directory: plugins/hallow-assurance

      - name: Install Gremlins
        run: |
          GOBIN="$RUNNER_TEMP/tools" go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.12.17
          enable-cache: false

      - name: Locate Lean install
        if: needs.changes.outputs.lean == 'true'
        id: lean-dir
        run: echo "dir=${MISE_DATA_DIR:-$HOME/.local/share/mise}/installs/github-leanprover-lean4" >> "$GITHUB_OUTPUT"

      - name: Cache Lean toolchain
        if: needs.changes.outputs.lean == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.lean-dir.outputs.dir }}
          key: lean-${{ runner.os }}-${{ hashFiles('plugins/hallow-assurance/formal/assure/mise.toml') }}

      - name: Cache lake build
        if: needs.changes.outputs.lean == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: plugins/hallow-assurance/formal/assure/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('plugins/hallow-assurance/formal/assure/lean-toolchain', 'plugins/hallow-assurance/formal/assure/lake-manifest.json') }}

      - name: Install Lean
        if: needs.changes.outputs.lean == 'true'
        working-directory: plugins/hallow-assurance/formal/assure
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise install github:leanprover/lean4

      - name: Build Lean model
        if: needs.changes.outputs.lean == 'true'
        working-directory: plugins/hallow-assurance/formal/assure
        run: mise exec -- lake build

      - name: Audit Lean axioms
        if: needs.changes.outputs.lean == 'true'
        working-directory: plugins/hallow-assurance/formal/assure
        run: mise exec -- lake exe axiom-audit --json

      - name: Test
        env:
          ASSURE_DRT: ${{ needs.changes.outputs.lean == 'true' && '1' || '' }}
        run: go test -race -shuffle=on ./...

  evaluate:
    needs: changes
    if: needs.changes.outputs.run == 'true' && github.event.pull_request
    permissions:
      contents: read
    uses: ./.github/workflows/assure-evaluate.yml
    with:
      working-directory: plugins/hallow-assurance

  evaluate-typescript:
    needs: changes
    if: needs.changes.outputs.run == 'true' && github.event.pull_request
    permissions:
      contents: read
    uses: ./.github/workflows/assure-evaluate.yml
    with:
      working-directory: plugins/hallow-assurance/testdata/smoke-ts

  evaluate-python:
    needs: changes
    if: needs.changes.outputs.run == 'true' && github.event.pull_request
    permissions:
      contents: read
    uses: ./.github/workflows/assure-evaluate.yml
    with:
      working-directory: plugins/hallow-assurance/testdata/smoke-py

  release:
    needs: changes
    if: startsWith(github.ref, 'refs/tags/plugins/hallow-assurance/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check tag and plugin version
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          tag=${REF#refs/tags/plugins/hallow-assurance/v}
          if ! printf '%s\n' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag ${REF#refs/tags/} is not plugins/hallow-assurance/vX.Y.Z"
            exit 1
          fi
          plugin=$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' plugin/.claude-plugin/plugin.json)
          if [ "$plugin" != "$tag" ]; then
            echo "::error::tag is v$tag but plugin/.claude-plugin/plugin.json version is '$plugin'"
            exit 1
          fi
          if ! jq -e '.plugins[] | select(.name == "hallow-assurance") | has("version") | not' ../../.claude-plugin/marketplace.json >/dev/null; then
            echo "::error::the hallow-assurance marketplace entry carries a version; plugin.json would override it silently"
            exit 1
          fi

  qualification:
    needs: changes
    if: needs.changes.outputs.qualify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: plugins/hallow-assurance/go.mod
          cache-dependency-path: plugins/hallow-assurance/go.sum

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22.12'

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: 0.12.17
          enable-cache: false

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca  # v5.1.1
        with:
          version: 2026.8.14
          install: false
          cache: false

      - name: Install Gremlins
        run: |
          GOBIN="$RUNNER_TEMP/tools" go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - name: Qualify
        env:
          ASSURE_QUALIFICATION: '1'
        run: go test -count=1 -v -timeout 28m ./qualification/...

  assure-gate:
    needs: [changes, go, evaluate, evaluate-typescript, evaluate-python, release, qualification]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .

    steps:
      - name: Decide
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN: ${{ needs.changes.outputs.run }}
          PR: ${{ github.event.pull_request.number }}
          REF: ${{ github.ref }}
          GO: ${{ needs.go.result }}
          EVAL: ${{ needs.evaluate.result }}
          EVAL_TS: ${{ needs.evaluate-typescript.result }}
          EVAL_PY: ${{ needs.evaluate-python.result }}
          RELEASE: ${{ needs.release.result }}
          QUALIFY: ${{ needs.changes.outputs.qualify }}
          QUAL: ${{ needs.qualification.result }}
        run: |
          set -euo pipefail
          ran() { [ "$1" = success ] || { [ "$2" = false ] && [ "$1" = skipped ]; }; }
          if [ "$RUN" = true ] && [ -n "$PR" ]; then pr_run=true; else pr_run=false; fi
          case "$REF" in refs/tags/plugins/hallow-assurance/v*) tagged=true ;; *) tagged=false ;; esac
          if [ "$CHANGES" = success ] && ran "$GO" "$RUN" && ran "$EVAL" "$pr_run" && ran "$EVAL_TS" "$pr_run" \
            && ran "$EVAL_PY" "$pr_run" && ran "$RELEASE" "$tagged" && ran "$QUAL" "$QUALIFY"; then
            exit 0
          fi
          echo "::error::assure-gate: changes=$CHANGES run=$RUN pr=${PR:-none} go=$GO evaluate=$EVAL evaluate-typescript=$EVAL_TS evaluate-python=$EVAL_PY release=$RELEASE qualify=$QUALIFY qualification=$QUAL"
          exit 1
