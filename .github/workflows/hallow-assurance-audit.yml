name: hallow-assurance-audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hallow-assurance-audit
  cancel-in-progress: false

jobs:
  audit:
    permissions:
      contents: read
    uses: ./.github/workflows/assure-audit.yml
    with:
      working-directory: plugins/hallow-assurance
